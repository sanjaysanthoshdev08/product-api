spring.application.name=product-api

spring.datasource.url=jdbc:mysql://localhost:3306/product_db
spring.datasource.username=root
spring.datasource.password=sanjaysanthosh08

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Password reset
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset.expiry-minutes=30
app.mail.from=${MAIL_FROM:no-reply@product-api.local}

# SMTP: set env vars SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
# SPRING_MAIL_PASSWORD to send real emails. Without SPRING_MAIL_HOST (development)
# the reset link is printed in the backend log instead of being emailed.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Login lifetime in hours (168 = 7 days)
app.jwt.expiration-hours=168

# AI try-on ("Make it realistic" in the fitting room), uses the Gemini image API.
# Set GEMINI_API_KEY (never commit a key). Image output may need a billing-enabled
# key: free-tier quota for image models can be 0. GEMINI_MODEL picks the model.
app.tryon.gemini-api-key=${GEMINI_API_KEY:}
app.tryon.model=${GEMINI_MODEL:gemini-2.5-flash-image}
# Folder that holds /images and /mannequins (the frontend public folder)
app.tryon.images-dir=${TRYON_IMAGES_DIR:frontend/public}
# New pictures one user may make per hour (stored ones are free)
app.tryon.max-per-hour=10
