spring.application.name=product-api

spring.datasource.url=jdbc:mysql://localhost:3306/product_db
spring.datasource.username=root
spring.datasource.password=sanjaysanthosh08

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Password reset
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset.expiry-minutes=30
app.mail.from=${MAIL_FROM:no-reply@product-api.local}

# SMTP: set env vars SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
# SPRING_MAIL_PASSWORD to send real emails. Without SPRING_MAIL_HOST (development)
# the reset link is printed in the backend log instead of being emailed.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
